      if ((h = head(['action / livrable', 'projet'])) || (h = head(['action / livrable', 'id projet']))) {
        const pcts = rows.slice(h.i + 1).map(r => val(r, h.idx, 'avancement %', 'avancement')).filter(v => typeof v === 'number');
        const frac = pcts.length && Math.max(...pcts) <= 1;
        for (const row of rows.slice(h.i + 1)) {
          const title = txt(row, h.idx, 'action / livrable'); if (!title) continue;
          const ref = txt(row, h.idx, 'id action'), key = (ref || title) + '|' + txt(row, h.idx, 'id projet', 'projet');
          if (seenA.has(key)) continue; seenA.add(key);
          let pct = val(row, h.idx, 'avancement %', 'avancement'); pct = typeof pct === 'number' ? pct : parseFloat(String(pct ?? '').replace(',', '.')) || 0;
          if (frac) pct *= 100;
          found.actions.push({ pref: txt(row, h.idx, 'id projet'), pname: txt(row, h.idx, 'projet'), ref, title, phase: txt(row, h.idx, 'axe / lot', 'phase'), result: txt(row, h.idx, 'resultat attendu'), owner: txt(row, h.idx, 'responsable'), priority: labelKey(PRIORITY, val(row, h.idx, 'priorite'), 'normal'), status: labelKey(STATUS, val(row, h.idx, 'statut'), 'todo', ST_SYN), progress: clamp(Math.round(pct), 0, 100), start: xDate(val(row, h.idx, 'date debut')), due: xDate(val(row, h.idx, 'date cible', 'echeance')), next: txt(row, h.idx, 'prochaine etape'), nextDate: xDate(val(row, h.idx, 'date prochain point')), risk: txt(row, h.idx, 'risque / blocage'), decision: txt(row, h.idx, 'decision / arbitrage'), description: txt(row, h.idx, 'commentaires', 'commentaire') });
        }
      }
      if ((h = head(['etape', 'debut', 'fin', 'jalon']))) {
        const title = String((rows[0] || []).find(v => v) || '');
        const pname = title.includes('–') ? title.split('–').slice(1).join('–').trim() : title.includes(' - ') ? title.split(' - ').slice(1).join(' - ').trim() : '';
        for (const row of rows.slice(h.i + 1)) {
          const jt = txt(row, h.idx, 'jalon'); if (!jt) continue;
          const m = jt.match(/^\s*(J\s?\d+)\s*[:\-–]\s*(.+)$/i);
          let date = frDate(jt) || xDate(val(row, h.idx, 'fin'));
          if (date && !frDate(jt) && dow(date) === 0) date = addDays(date, -2);
          if (date && !frDate(jt) && dow(date) === 6) date = addDays(date, -1);
          const st = H(val(row, h.idx, 'statut'));
          found.milestones.push({ pname, ref: m ? m[1].replace(/\s/g, '').toUpperCase() : '', title: cap(m ? m[2].trim() : jt), date: date || today(), done: ['termine', 'atteint', 'valide', 'fait'].includes(st), type: /decision/i.test(norm(jt)) ? 'decision' : 'milestone', description: txt(row, h.idx, 'etape') });
        }
      }
      if ((h = head(['jalon', 'intitule', 'date']))) {
        for (const row of rows.slice(h.i + 1)) {
          const t = txt(row, h.idx, 'intitule'); if (!t) continue;
          found.milestones.push({ pref: txt(row, h.idx, 'id projet'), pname: txt(row, h.idx, 'projet'), ref: txt(row, h.idx, 'jalon'), title: t, date: xDate(val(row, h.idx, 'date')) || today(), done: H(val(row, h.idx, 'statut')) === 'atteint', key: H(val(row, h.idx, 'jalon cle')) === 'oui', type: labelKey(MSTYPE, val(row, h.idx, 'type'), 'milestone'), description: txt(row, h.idx, 'description') });
        }
      }
    }
    const n = found.projects.length + found.actions.length + found.milestones.length;
    if (!n) throw new Error('aucun onglet reconnu (il faut au moins un onglet « Projets » ou « Plan d\'action » avec ses en-têtes)');
    const ok = await confirmDialog({ title: 'Importer ce classeur Excel ?', message: `« ${esc(file.name)} » contient <b>${plural(found.projects.length, 'projet')}</b>, <b>${plural(found.actions.length, 'action')}</b> et <b>${plural(found.milestones.length, 'jalon')}</b>.<br><br>Les éléments existants (même ID ou même intitulé) seront <b>mis à jour</b>, les autres <b>ajoutés</b>. Rien n'est supprimé, et tu pourras annuler.`, ok: 'Importer' });
    if (!ok) return;
    const stats = { pc: 0, pu: 0, ac: 0, au: 0, mc: 0, mu: 0 };
    commit(s => {
      const findP = (ref, name) => s.projects.find(p => (ref && p.ref === ref) || (name && H(p.name) === H(name)));
      const ensureP = (ref, name) => {
        let p = findP(ref, name);
        if (!p && (ref || name)) { p = migrate({ projects: [{ id: uid('p'), ref: ref || '', name: name || ref, status: 'active', context: 'natran', color: nextColor(), createdAt: new Date().toISOString() }] }).projects[0]; s.projects.push(p); stats.pc++; }
        return p;
      };
      const fill = (o, data) => { for (const [k, v] of Object.entries(data)) if (v !== '' && v != null) o[k] = v; };
      for (const ip of found.projects) {
        let p = findP(ip.ref, ip.name);
        if (p) { fill(p, ip); stats.pu++; }
        else { p = Object.assign(migrate({ projects: [{ id: uid('p'), context: 'natran', color: nextColor(), createdAt: new Date().toISOString(), ...ip }] }).projects[0]); s.projects.push(p); stats.pc++; }
      }
      const single = s.projects.length === 1 ? s.projects[0] : (found.projects.length === 1 ? findP(found.projects[0].ref, found.projects[0].name) : null);
      for (const ia of found.actions) {
        const p = (ia.pref || ia.pname) ? ensureP(ia.pref, ia.pname) : single; if (!p) continue;
        const { pref, pname, ...data } = ia;
        let a = s.actions.find(x => x.projectId === p.id && ((data.ref && x.ref === data.ref) || H(x.title) === H(data.title)));
        if (a) { fill(a, data); if (data.status === 'done' && !a.doneAt) a.doneAt = data.due || today(); stats.au++; }
        else { s.actions.push(Object.assign({ id: uid('a'), projectId: p.id, effort: null, milestoneId: null, dependsOn: [], checklist: [], skills: [], link: '', recur: '', createdAt: new Date().toISOString(), doneAt: data.status === 'done' ? (data.due || today()) : null }, data)); stats.ac++; }
      }
      for (const im of found.milestones) {
        const p = (im.pref || im.pname) ? (findP(im.pref, im.pname) || single) : single; if (!p) continue;
        const { pref, pname, ...data } = im;
        let m = s.milestones.find(x => x.projectId === p.id && ((data.ref && x.ref === data.ref) || H(x.title) === H(data.title)));
        if (m) { fill(m, data); m.done = !!data.done; stats.mu++; }
        else { s.milestones.push(Object.assign({ id: uid('m'), projectId: p.id, key: false }, data)); stats.mc++; }
      }
      Object.assign(s, migrate(s));
    });
    toast(`Import terminé : ${stats.pc + stats.pu} projet(s), ${stats.ac} action(s) ajoutée(s), ${stats.au} mise(s) à jour, ${stats.mc + stats.mu} jalon(s).`, 'success', { label: 'Annuler', fn: undo });
  } catch (e) { console.error(e); toast('Import Excel impossible : ' + e.message, 'error'); }
}

const logoSrc = k => k === 'natranDark' ? (S.settings.logos.natran || LOGO_DEFAULT.natranDark) : (S.settings.logos[k] || LOGO_DEFAULT[k]);
function applyLogos(root) {
  $$('img[data-logo]', root).forEach(img => { const s = logoSrc(img.dataset.logo); if (img.getAttribute('src') !== s) img.src = s; });
}
function readLogo(file, k) {
  const r = new FileReader();
  r.onload = () => {
    const url = r.result;
    const done = u => { commit(s => { s.settings.logos[k] = u; }); applyLogos(); toast('Logo mis à jour.', 'success'); };
    if (file.type === 'image/svg+xml' || file.size < 250000) return done(url);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 640 / img.width);
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL('image/png'));
    };
    img.src = url;
  };
  r.readAsDataURL(file);
}

/* =====================================================================
   3. Accès aux données & calculs
   ===================================================================== */
const proj = id => S.projects.find(p => p.id === id);
const act = id => S.actions.find(a => a.id === id);
const mil = id => S.milestones.find(m => m.id === id);
const actionsOf = pid => S.actions.filter(a => a.projectId === pid);
const byDate = (a, b) => (a.date || '').localeCompare(b.date || '') || (a.ref || '').localeCompare(b.ref || '', 'fr', { numeric: true });
const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || PRIORITY[a.priority].rank - PRIORITY[b.priority].rank;
const milestonesOf = pid => S.milestones.filter(m => m.projectId === pid).sort(byDate);
const colorOf = p => `var(--s${p ? p.color : 1})`;
const PORDER = { active: 0, planned: 1, frame: 2, paused: 3, done: 4, cancelled: 5 };
const sortedProjects = () => S.projects.slice().sort((a, b) => PORDER[a.status] - PORDER[b.status] || (a.end || '9999').localeCompare(b.end || '9999') || a.name.localeCompare(b.name, 'fr'));
const owners = () => [...new Set(S.actions.map(a => a.owner).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fr'));
const phasesOf = pid => [...new Set(actionsOf(pid).map(a => a.phase).filter(Boolean))];

function actionProgress(a) {
  if (a.status === 'done') return 100;
  if (a.checklist && a.checklist.length) return Math.round(a.checklist.filter(c => c.done).length / a.checklist.length * 100);
  return clamp(Math.round(+a.progress || 0), 0, 100);
}
function actionSpan(a) {
  const s = a.start || a.due, e = a.due || a.start;
  if (!s) return null;
  return s <= e ? [s, e] : [e, s];
}
const isOverdue = a => !isClosed(a.status) && !!a.due && a.due < today();
function alertOf(a) {
  if (isClosed(a.status)) return 'closed';
  if (!a.due) return 'none';
  const n = diffDays(today(), a.due);
  return n < 0 ? 'late' : n <= 7 ? 'soon' : 'ok';
}
const avgProgress = list => { const l = list.filter(a => a.status !== 'cancelled'); return l.length ? Math.round(l.reduce((s, a) => s + actionProgress(a), 0) / l.length) : 0; };
function projectProgress(p) { return p.status === 'done' ? 100 : avgProgress(actionsOf(p.id)); }
function projectSpan(p) {
  const ds = [p.start, p.end];
  actionsOf(p.id).forEach(a => { const sp = actionSpan(a); if (sp) ds.push(sp[0], sp[1]); });
  milestonesOf(p.id).forEach(m => ds.push(m.date));
  const f = ds.filter(Boolean).sort();
  return f.length ? [f[0], f[f.length - 1]] : null;
}
/* ---------- Avancement prévu : calculé d'après les dates des actions (et non au prorata du projet) ---------- */
function plannedAt(list, d) {
  const l = list.filter(a => a.status !== 'cancelled');
  if (!l.length || !l.some(actionSpan)) return null;
  let t = 0;

/* ---------- Menus contextuels (statut, avancement) ---------- */
let popClose = null;
function openPop(anchor, html, onPick) {
  closePop(); hideTip();
  const root = $('#pop-root');
  root.innerHTML = `<div class="pop" role="menu">${html}</div>`;
  const el = root.firstChild;
  const place = () => {
    const r = anchor.getBoundingClientRect();
    if (!anchor.isConnected || r.bottom < 0 || r.top > innerHeight) { closePop(); return; }
    const w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(r.left, innerWidth - w - 8), y = r.bottom + 6;
    if (y + h > innerHeight - 8) y = r.top - h - 6;
    el.style.left = Math.max(8, x) + 'px'; el.style.top = Math.max(8, y) + 'px';
  };
  place();
  el.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (!b) return; e.stopPropagation(); const v = b.dataset.pick; closePop(); onPick(v); });
  const off = e => { if (!el.contains(e.target) && !anchor.contains(e.target)) closePop(); };
  const onScroll = e => { if (!el.contains(e.target)) place(); };
  setTimeout(() => document.addEventListener('mousedown', off), 0);
  window.addEventListener('scroll', onScroll, true);
  popClose = () => { document.removeEventListener('mousedown', off); window.removeEventListener('scroll', onScroll, true); root.innerHTML = ''; popClose = null; };
  el.addEventListener('keydown', e => {
    const bs = $$('button', el), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); (bs[i + 1] || bs[0]).focus(); }
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); (bs[i - 1] || bs[bs.length - 1]).focus(); }
    else if (e.key === 'Tab') closePop();
  });
  const f = el.querySelector('.on') || el.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function closePop() { if (popClose) popClose(); }
function pickStatus(anchor, a) {
  openPop(anchor, `<div class="ph">Statut</div>` + STATUS_ORDER.map(s => `<button type="button" class="opt ${s === a.status ? 'on' : ''}" data-pick="${s}">${stChip(s)}${s === a.status ? `<span class="ck">${ic('check', 16, 2.4)}</span>` : ''}</button>`).join(''), v => {
    const was = a.status;

const STATUS_FILTERS = { open: 'Ouvertes (non clôturées)', all: 'Toutes les actions', prio: 'À traiter en priorité', late: 'En retard', soon: 'Échéance ≤ 7 jours', stuck: 'Bloquées / en attente', school: "Pendant l'école", todo: '○ À lancer', doing: '◐ En cours', waiting: '◷ En attente', blocked: '✕ Bloquées', done: '✓ Terminées', cancelled: '⊘ Annulées' };

function filterActions(list, projectId) {
  const f = AF();

  else if (st === 'stuck') list = list.filter(a => a.status === 'blocked' || a.status === 'waiting');
  else if (st === 'school') list = list.filter(schoolClash);
  else if (STATUS[st]) list = list.filter(a => a.status === st);
  if (f.prio !== 'all') list = list.filter(a => a.priority === f.prio);
  if (f.owner === 'me') list = list.filter(isMine);
  else if (f.owner === 'others') list = list.filter(a => !isMine(a));
  else if (f.owner !== 'all') list = list.filter(a => a.owner === f.owner);
  if (f.q) { const q = norm(f.q); list = list.filter(a => norm([a.ref, a.title, a.result, a.owner, a.phase, a.next, a.description, a.risk, a.decision].join(' ')).includes(q)); }

function sortActions(list, key) {

    status: (a, b) => st(a) - st(b) || due(a).localeCompare(due(b)),
    start: (a, b) => start(a).localeCompare(start(b)) || due(a).localeCompare(due(b)),
    ref: (a, b) => (a.ref || '~').localeCompare(b.ref || '~', 'fr', { numeric: true }) || start(a).localeCompare(start(b)),

    project: (a, b) => (proj(a.projectId)?.name || '').localeCompare(proj(b.projectId)?.name || '', 'fr') || due(a).localeCompare(due(b))

}

function replanDates(a, mode, days, date, avoid) {

  if (mode === 'shift') { s = addDays(sp[0], days); e = fix(addDays(sp[1], days)); }

  return [s, e];

  const n = ids.length, lbl = plural(n, 'action');
  if (op === 'shift') {
    openPop(anchor, `<div class="ph">Décaler les dates</div><div class="grid-pct" style="grid-template-columns:repeat(3,1fr)">${[-7, -1, 1, 3, 7, 14].map(d => `<button type="button" data-pick="${d}">${d > 0 ? '+' : ''}${d} j</button>`).join('')}</div><button type="button" class="opt" data-pick="school">${ic('school', 15)} Après l'école / jours fériés</button><button type="button" class="opt" data-pick="today">${ic('target', 15)} Repartir d'aujourd'hui</button>`, v => {
      commit(() => ids.forEach(id => { const a = act(id), sp = actionSpan(a); if (!sp) return;
        if (v === 'school') { const e = nextCompanyDay(sp[1]); const delta = diffDays(sp[1], e); a.due = e; if (a.start) a.start = addDays(a.start, delta); }
        else if (v === 'today') { const [s, e] = replanDates(a, 'today', 0, null, true); a.start = s; a.due = e; }

  } else if (op === 'prio') {

  } else if (op === 'owner') {

    openPop(anchor, `<div class="ph">Responsable</div><div style="max-height:260px;overflow:auto">${list.map(o => `<button type="button" class="opt" data-pick="${esc(o)}">${ic('user', 14)} ${esc(o)}</button>`).join('')}</div>`, v => { commit(() => ids.forEach(id => { act(id).owner = v; })); done(`Responsable : ${v} (${lbl}).`); });

      if (!ok) return;
      commit(s => { const g = new Set(ids); s.actions = s.actions.filter(a => !g.has(a.id)); s.actions.forEach(a => { a.dependsOn = a.dependsOn.filter(x => !g.has(x)); }); });

/* ---------- Gantt ---------- */

    if (!projectId) rows.push({ type: 'project', p });

    if (!projectId && UI.gCollapsed[p.id]) continue;
    const groups = phaseGroups(acts);
    const phased = groups.some(g => g.name);
    for (const g of groups) {
      const key = p.id + '|' + g.name;
      if (phased) rows.push({ type: 'phase', p, g, key });

function ganttHTML(projectId) {

/* ---------- Jalons ---------- */
function milestonesBlock(projectId) {
  const f = UI.msf;
  let list = projectId ? milestonesOf(projectId) : S.milestones.slice().sort(byDate);
  if (!projectId && UI.msp && UI.msp !== 'all') list = list.filter(m => m.projectId === UI.msp);
  const all = list;
  if (f === 'upcoming') list = list.filter(m => !m.done);
  else if (f === 'late') list = list.filter(m => msStatus(m) === 'late');
  else if (f === 'done') list = list.filter(m => m.done);
  const cnt = k => ({ upcoming: all.filter(m => !m.done).length, late: all.filter(m => msStatus(m) === 'late').length, done: all.filter(m => m.done).length, all: all.length }[k]);
  let lastMonth = '', html = '';
  for (const m of list) {
    const mo = m.date.slice(0, 7);
    if (mo !== lastMonth) { html += `<div class="mtl-month">${fmtMY(m.date)}</div>`; lastMonth = mo; }
    const p = proj(m.projectId), st = msStatus(m), linked = S.actions.filter(a => a.milestoneId === m.id);
    const lp = linked.length ? avgProgress(linked) : null;
    html += `<div class="mtl-item"><div class="mtl-date"><b>${parse(m.date).getDate()}</b><span>${MONTHS_S[parse(m.date).getMonth()]} · S${isoWeek(m.date)}</span></div><div class="mtl-node"><span class="dia ${st === 'upcoming' ? '' : st}"></span></div>
      <div class="mtl-card"><div><h4>${refTag(m.ref)}<button type="button" class="linklike" data-act="edit-milestone" data-id="${m.id}">${esc(m.title)}</button></h4>
        <div class="meta" style="margin-top:6px">${projectId ? '' : `<a href="#/projet/${p?.id}/jalons" class="row" style="gap:6px"><span class="dot" style="--c:${colorOf(p)};width:8px;height:8px"></span>${esc(p?.name)}</a>`}<span class="chip ${st === 'done' ? 'st-done' : st === 'late' ? 'st-blocked' : 'st-todo'}">${st === 'done' ? '✓' : st === 'late' ? '!' : '◆'} ${msLabel(st)}</span><span class="chip t-info">${MSTYPE[m.type]}</span>${m.key ? '<span class="keytag">◆ JALON CLÉ</span>' : ''}${periodTag(m.date)}<span class="muted">${st === 'upcoming' ? relDue(m.date) : fmtS(m.date, true)}</span></div></div>
        <label class="check small"><input type="checkbox" class="cb" data-change="toggle-ms" data-id="${m.id}" ${m.done ? 'checked' : ''}> Atteint</label>
        ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}
        ${linked.length ? `<div class="lk">${pbar(lp, colorOf(p), null, 'sm')}<span>${linked.filter(a => a.status === 'done').length}/${linked.length} actions liées terminées · ${lp} %</span></div>` : ''}
      </div></div>`;
  }
  return `<div class="toolbar"><div class="seg">${[['upcoming', 'À atteindre'], ['late', 'En retard'], ['done', 'Atteints'], ['all', 'Tous']].map(([k, l]) => `<button type="button" class="${f === k ? 'on' : ''}" data-act="msf" data-v="${k}">${l} <span class="muted">${cnt(k)}</span></button>`).join('')}</div>
    ${projectId ? '' : `<select class="select sm" style="max-width:240px" data-change="msp" aria-label="Projet">${projOpts(UI.msp || 'all', 'Tous les projets')}</select>`}
    <span class="spacer"></span><button class="btn btn-primary" data-act="new-milestone" data-project="${projectId || ''}">${ic('plus', 16)} Nouveau jalon</button></div>
    ${list.length ? `<div class="mtl">${html}</div>` : `<div class="card">${emptyBox('flag', all.length ? 'Aucun jalon dans ce filtre' : 'Aucun jalon', 'Les jalons marquent les étapes clés : validation, livrable, décision, Go / No Go…', `<button class="btn btn-primary" data-act="new-milestone" data-project="${projectId || ''}">${ic('plus', 16)} Ajouter un jalon</button>`)}</div>`}`;
}

/* ---------- Journal de bord ---------- */
function journalEntry(j) {
  const p = j.projectId ? proj(j.projectId) : null;
  const head = `<div class="jentry-h"><span class="d">${cap(fmtL(j.date))}</span>${j.type === 'review' ? '<span class="keytag">REVUE HEBDO</span>' : j.type === 'point' ? '<span class="keytag">POINT HEBDO</span>' : ''}${p ? `<a class="chip" href="#/projet/${p.id}/journal"><span class="dot" style="--c:${colorOf(p)};width:8px;height:8px"></span>${esc(p.name)}</a>` : '<span class="chip">Général</span>'}${j.mood ? `<span class="chip">Moral : ${MOODS[j.mood] || ''}</span>` : ''}<span class="spacer"></span>
    <button type="button" class="btn btn-ghost btn-icon btn-sm" data-act="${j.type === 'review' ? 'weekly-review' : 'edit-note'}" data-id="${j.id}" aria-label="Modifier">${ic('edit', 15)}</button><button type="button" class="btn btn-ghost btn-icon btn-sm btn-danger" data-act="delete-note" data-id="${j.id}" aria-label="Supprimer">${ic('trash', 15)}</button></div>`;

function progressChart(el, p) {
  const W = Math.max(280, el.clientWidth), H = 230, m = { t: 22, r: 70, b: 28, l: 42 };
  const sp = projectSpan(p), s0 = p.start || sp?.[0], e0 = p.end || sp?.[1];
  if (!s0 || !e0 || e0 <= s0) { el.innerHTML = `<div class="empty" style="min-height:200px">${ic('calendar', 22)}<span>Renseigne les dates de début et de fin du projet pour afficher la courbe.</span></div>`; return; }
  const log = S.progressLog[p.id] || {};
  const pts = Object.keys(log).sort().map(d => [d, log[d]]);
  const t = today();
  const x0 = minD(s0, pts[0]?.[0]), x1 = maxD(e0, t, pts.length ? pts[pts.length - 1][0] : null);
  const span = Math.max(1, diffDays(x0, x1)), iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = d => m.l + diffDays(x0, d) / span * iw, Y = v => m.t + (1 - v / 100) * ih;
  let g = '';
  [0, 25, 50, 75, 100].forEach(v => { g += `<line class="${v === 0 ? 'base-l' : 'grid-l'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="tnum">${v} %</text>`; });
  const months = []; for (let d = firstOfMonth(x0) < x0 ? addMonths(x0, 1) : firstOfMonth(x0); d <= x1; d = addMonths(d, 1)) months.push(d);
  const step = Math.max(1, Math.ceil(months.length / Math.max(2, Math.floor(iw / 64))));
  months.forEach((d, i) => { if (i % step) return; const dd = parse(d); g += `<text x="${X(d)}" y="${H - 8}" text-anchor="middle">${MONTHS_S[dd.getMonth()]}${dd.getMonth() === 0 ? ' ' + String(dd.getFullYear()).slice(2) : ''}</text>`; });
  if (t >= x0 && t <= x1) g += `<line class="tl" x1="${X(t)}" x2="${X(t)}" y1="${m.t - 4}" y2="${H - m.b}"/><text x="${X(t)}" y="${m.t - 9}" text-anchor="middle" class="lbl">Aujourd'hui</text>`;
  const samp = [], stepD = Math.max(1, Math.round(span / 80));
  for (let d = x0; d <= x1; d = addDays(d, stepD)) samp.push(d);
  if (samp[samp.length - 1] !== x1) samp.push(x1);
  const plan = samp.map((d, i) => `${i ? 'L' : 'M'}${X(d).toFixed(1)},${Y(expectedAt(p, d) ?? 0).toFixed(1)}`).join(' ');
  const real = pts.map(([d, v], i) => `${i ? 'L' : 'M'}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  const area = pts.length > 1 ? `${real} L${X(last[0]).toFixed(1)},${Y(0)} L${X(pts[0][0]).toFixed(1)},${Y(0)} Z` : '';
  const exNow = expectedAt(p, last ? last[0] : t);
  const lblY = last ? (Math.abs(Y(last[1]) - Y(exNow ?? -100)) < 14 ? Y(last[1]) + 16 : Y(last[1]) + 4) : 0;
  el.style.setProperty('--c', colorOf(p));
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Courbe d'avancement : réel ${last ? last[1] : 0} %, prévu ${expectedProgress(p) ?? '—'} %">${g}
    <path class="plan" d="${plan}"/>${area ? `<path class="area" d="${area}"/>` : ''}${real ? `<path class="real" d="${real}"/>` : ''}
    ${last ? `<circle class="pt" cx="${X(last[0])}" cy="${Y(last[1])}" r="5"/><text class="lbl" x="${X(last[0]) + 10}" y="${lblY}">Réel ${last[1]} %</text>` : ''}
    <text class="lbl" x="${Math.min(X(e0), W - m.r)}" y="${Y(100) - 8}" text-anchor="end">Prévu</text>
    <g class="hov" style="display:none"><line class="xh" y1="${m.t}" y2="${H - m.b}"/><circle class="pt" r="5"/></g>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg = $('svg', el), hov = $('.hov', svg), xh = $('.xh', hov), dotc = $('circle', hov);
  $('.hit', svg).addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), mx = clamp(e.clientX - r.left, m.l, m.l + iw);
    const d = addDays(x0, Math.round((mx - m.l) / iw * span));
    let rv = null; for (const [dd, v] of pts) { if (dd <= d) rv = v; else break; }
    const pv = expectedAt(p, d);
    hov.style.display = ''; xh.setAttribute('x1', X(d)); xh.setAttribute('x2', X(d));
    if (rv != null && d <= (last ? last[0] : t)) { dotc.style.display = ''; dotc.setAttribute('cx', X(d)); dotc.setAttribute('cy', Y(rv)); } else dotc.style.display = 'none';
    showTip(`${cap(fmtL(d))}\nRéel : ${rv != null && d <= t ? rv + ' %' : '—'}\nPrévu : ${pv != null ? pv + ' %' : '—'}`, e.clientX, e.clientY);
  });
  $('.hit', svg).addEventListener('pointerleave', () => { hov.style.display = 'none'; hideTip(); });
}

    title: `${ic('calendar', 20)} Ajouter à mon agenda Outlook`,
    body: `<p class="muted" style="margin-bottom:14px">Crée un fichier <b>.ics</b> à ouvrir avec Outlook (ou Google Agenda) : chaque élément devient un évènement « journée entière », avec un rappel la veille si tu le souhaites.</p>
      <div class="fsec">
        <label class="check"><input type="checkbox" class="cb" name="mine" checked> Dates cibles de <b>mes</b> actions ouvertes</label>
        <label class="check"><input type="checkbox" class="cb" name="others"> Dates cibles des actions des autres (pour les relances)</label>
        <label class="check"><input type="checkbox" class="cb" name="points" checked> Prochains points de suivi</label>

        <label class="check"><input type="checkbox" class="cb" name="periods" checked> Périodes à l'ISTP et épreuves finales</label>

      </div>
      <p class="muted small" style="margin-top:10px">Outlook importe une copie : après de gros changements dans ton plan, refais un export (les évènements existants sont mis à jour grâce à leur identifiant).</p>`,
    footer: `<span class="spacer"></span><button type="button" class="btn" data-cancel>Annuler</button><button type="submit" class="btn btn-primary">${ic('download', 16)} Télécharger le fichier .ics</button>`,
    onSubmit: form => { const o = {}; ['mine', 'others', 'points', 'ms', 'periods', 'alarm'].forEach(k => { o[k] = form.elements[k].checked; }); const n = exportICS(o); toast(`${plural(n, 'évènement')} exporté${n > 1 ? 's' : ''} : ouvre le fichier pour l'ajouter à Outlook.`, 'success'); }
  });
}
function exportICS(o) {
  const escT = v => String(v || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const dt = d => d.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const fold = l => { const out = []; while (l.length > 73) { out.push(l.slice(0, 73)); l = ' ' + l.slice(73); } out.push(l); return out.join('\r\n'); };
  const ev = [];
  const add = (uidv, start, end, summary, desc, cat) => {
    const L = ['BEGIN:VEVENT', `UID:${uidv}@plan-action-natran`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dt(start)}`, `DTEND;VALUE=DATE:${dt(addDays(end || start, 1))}`, `SUMMARY:${escT(summary)}`, `DESCRIPTION:${escT(desc)}`, `CATEGORIES:${escT(cat)}`, 'TRANSP:TRANSPARENT'];
    if (o.alarm && cat !== 'Alternance') L.push('BEGIN:VALARM', 'TRIGGER:-PT15H', 'ACTION:DISPLAY', `DESCRIPTION:${escT(summary)}`, 'END:VALARM');
    L.push('END:VEVENT'); ev.push(L.map(fold).join('\r\n'));
  };
  S.actions.filter(a => !isClosed(a.status)).forEach(a => {
    const p = proj(a.projectId), mine = isMine(a);
    if (a.due && ((mine && o.mine) || (!mine && o.others))) add(a.id + '-due', a.due, null, `${mine ? '' : '[' + (a.owner || '?') + '] '}${a.ref ? a.ref + ' · ' : ''}${a.title}`, `${p ? p.name + '\n' : ''}${a.result ? 'Résultat attendu : ' + a.result + '\n' : ''}${a.next ? 'Prochaine étape : ' + a.next : ''}`, 'Plan d\'action');
    if (o.points && a.nextDate) add(a.id + '-pt', a.nextDate, null, `Point : ${a.next || a.title}`, `${a.ref ? a.ref + ' · ' : ''}${a.title}\nResponsable : ${a.owner || 'moi'}`, 'Plan d\'action');
  });
  if (o.ms) S.milestones.filter(m => !m.done).forEach(m => add(m.id + '-ms', m.date, null, `◆ ${m.ref ? m.ref + ' · ' : ''}${m.title}`, `${MSTYPE[m.type]} · ${proj(m.projectId)?.name || ''}\n${m.description || ''}`, 'Jalons'));
  if (o.periods) periods().forEach(p => add(p.id + '-per', p.start, p.end, `${PTYPE[p.type].label} · ${p.label}`, `Calendrier d'alternance`, 'Alternance'));
  const txt = ['BEGIN:VCALENDAR', 'VERSION:2.0', "PRODID:-//Plan d'action NaTran//FR", 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', "X-WR-CALNAME:Plan d'action NaTran", ...ev, 'END:VCALENDAR'].join('\r\n');
  download(`plan-action-agenda-${today()}.ics`, txt, 'text/calendar;charset=utf-8');
  return ev.length;
}

/* ---------- Point hebdo prêt à envoyer (Teams, mail) ---------- */
function pointHebdoText() {
  const t = today(), w0 = addDays(t, -7), w1 = addDays(t, 7), P = S.profile;
  const line = a => `• ${a.ref ? a.ref + ' — ' : ''}${a.title}`;
  const done = S.actions.filter(a => a.status === 'done' && a.doneAt && a.doneAt >= w0);
  const doing = S.actions.filter(a => a.status === 'doing').sort(byDue);
  const stuck = S.actions.filter(a => !isClosed(a.status) && (a.status === 'blocked' || a.status === 'waiting' || isOverdue(a) || a.risk));
  const next = S.actions.filter(a => !isClosed(a.status) && a.due && a.due >= t && a.due <= w1).sort(byDue);
  const dec = S.actions.filter(a => !isClosed(a.status) && a.decision);
  const ms = S.milestones.filter(m => !m.done && m.date >= t && m.date <= addDays(t, 21)).sort(byDate);
  const sit = situation(w1), np = situation(t).next;
  const out = [`Point hebdo — semaine ${isoWeek(t)} (${fmtS(startOfWeek(t))} → ${fmtS(addDays(startOfWeek(t), 4), true)})${P.name ? ' — ' + P.name : ''}`, ''];
  S.projects.filter(p => p.status === 'active').forEach(p => out.push(`${p.ref ? p.ref + ' · ' : ''}${p.name} : ${projectProgress(p)} % (prévu ${expectedProgress(p) ?? '—'} %)`));
  out.push('', `✅ Terminé cette semaine (${done.length})`, ...(done.length ? done.map(line) : ['• —']));
  out.push('', `▶ En cours (${doing.length})`, ...(doing.length ? doing.map(a => `${line(a)} — ${actionProgress(a)} %`) : ['• —']));
  out.push('', `⚠ Points d'attention (${stuck.length})`, ...(stuck.length ? stuck.slice(0, 10).map(a => `${line(a)} — ${a.status === 'blocked' ? 'bloquée' : a.status === 'waiting' ? 'en attente' : isOverdue(a) ? 'en retard (' + fmtS(a.due) + ')' : 'risque'}${a.risk ? ' : ' + a.risk : ''}`) : ['• Rien de bloquant']));
  if (dec.length) out.push('', `❓ Décisions attendues (${dec.length})`, ...dec.slice(0, 8).map(a => `• ${a.ref ? a.ref + ' — ' : ''}${a.decision}`));
  out.push('', `📅 Semaine prochaine (${next.length})`, ...(next.length ? next.map(a => `${line(a)} — ${fmtS(a.due)}${isMine(a) ? '' : ' (' + a.owner + ')'}`) : ['• —']));
  if (ms.length) out.push('', '◆ Jalons à venir', ...ms.map(m => `• ${m.ref ? m.ref + ' · ' : ''}${m.title} — ${fmtS(m.date)}`));
  if (sit.kind === 'school') out.push('', `🎓 Je serai à l'ISTP (${sit.period.label}) du ${fmtS(sit.period.start)} au ${fmtS(sit.period.end)}.`);
  else if (np && diffDays(t, np.start) <= 21) out.push('', `🎓 Prochaine période à l'ISTP : ${np.label}, du ${fmtS(np.start)} au ${fmtS(np.end)}.`);
  return out.join('\n');
}
function pointHebdoModal() {
  const txt = pointHebdoText();
  openModal({
    title: `${ic('send', 20)} Mon point hebdo`, size: 'wide',
    body: `<p class="muted" style="margin-bottom:10px">Généré à partir de ton plan : relis, complète, puis copie-le dans Teams ou dans un mail à ton manager ou ton tuteur.</p><textarea class="textarea mono" id="ph-txt" name="txt" rows="20">${esc(txt)}</textarea>`,

function skillsReport() {

async function deleteProject(id) {
  const p = proj(id); if (!p) return;
  const na = actionsOf(id).length, nm = milestonesOf(id).length;
  const ok = await confirmDialog({ title: 'Supprimer ce projet ?', message: `« <b>${esc(p.name)}</b> » sera supprimé avec ${plural(na, 'action')} et ${plural(nm, 'jalon')}. Tu pourras annuler juste après.`, ok: 'Supprimer', danger: true });
  if (!ok) return;
  commit(s => {
    s.projects = s.projects.filter(x => x.id !== id);
    const gone = new Set(s.actions.filter(a => a.projectId === id).map(a => a.id));
    s.actions = s.actions.filter(a => a.projectId !== id);
    s.actions.forEach(a => { a.dependsOn = a.dependsOn.filter(x => !gone.has(x)); });
    s.milestones = s.milestones.filter(m => m.projectId !== id);
    s.journal.forEach(j => { if (j.projectId === id) j.projectId = null; });
  }, { render: false });
  if (R.page === 'projet') go('#/projets'); else render();
  toast('Projet supprimé.', '', { label: 'Annuler', fn: undo });
}

  const linked = m ? S.actions.filter(a => a.milestoneId === m.id) : [];

      ${fld('m-desc', 'Résultat attendu / critères de validation', `<textarea class="textarea" id="m-desc" name="description" rows="3">${esc(v.description || '')}</textarea>`)}
      ${linked.length ? `<div class="field"><span class="lbl">Actions liées (${linked.length})</span><ul class="tasks">${linked.map(a => taskItem(a, { project: false })).join('')}</ul></div>` : ''}

      if (m) commit(() => { const cur = mil(m.id); if (cur) { if (cur.projectId !== data.projectId) S.actions.forEach(a => { if (a.milestoneId === cur.id) a.milestoneId = null; }); Object.assign(cur, data); } });
      else commit(s => s.milestones.push(Object.assign({ id: uid('m') }, data)));

function weeklyReview(id) {
  const j = id ? S.journal.find(x => x.id === id) : null;
  const t = today(), w0 = addDays(t, -7), w1 = addDays(t, 7);
  const doneW = S.actions.filter(a => a.status === 'done' && a.doneAt && a.doneAt >= w0);
  const late = S.actions.filter(isOverdue).sort(byDue);
  const next = S.actions.filter(a => !isClosed(a.status) && a.due && a.due >= t && a.due <= w1).sort(byDue);
  const stuck = S.actions.filter(a => a.status === 'blocked' || a.status === 'waiting');
  const msN = S.milestones.filter(m => !m.done && m.date >= t && m.date <= addDays(t, 14)).sort(byDate);
  const bullets = list => list.map(a => '• ' + (a.ref ? a.ref + ' — ' : '') + a.title).join('\n');
  const v = j || { date: t, mood: 'good', done: bullets(doneW), blockers: bullets(stuck), next: bullets([...late, ...next].slice(0, 8)) };
  const col = (title, list, tone) => `<div class="kpi"><div class="l" style="margin-bottom:6px">${title} · <b>${list.length}</b></div>${list.slice(0, 5).map(x => `<div class="small" style="display:flex;gap:6px;align-items:center;padding:2px 0;${tone ? 'color:' + tone : ''}"><span class="dot" style="--c:${colorOf(proj(x.projectId))};width:7px;height:7px"></span><span class="ellipsis">${esc(x.title)}</span></div>`).join('') || '<div class="small muted">—</div>'}${list.length > 5 ? `<div class="small muted">+ ${list.length - 5} autres</div>` : ''}</div>`;
  openModal({
    title: j ? 'Revue hebdomadaire' : 'Ma revue de la semaine', size: 'wide',
    body: `${j ? '' : `<p class="muted" style="margin-bottom:12px">Voici ce qui s'est passé ces 7 derniers jours. Complète les trois questions, c'est rapide.</p>
      <div class="grid g-4" style="gap:10px;margin-bottom:16px">${col('✓ Terminées', doneW, '')}${col('⚑ En retard', late, 'var(--critical-text)')}${col('→ À venir 7 j', next, '')}<div class="kpi"><div class="l" style="margin-bottom:6px">◆ Jalons 14 j · <b>${msN.length}</b></div>${msN.slice(0, 5).map(m => `<div class="small ellipsis" style="padding:2px 0">${esc((m.ref ? m.ref + ' · ' : '') + m.title)} · ${fmtS(m.date)}</div>`).join('') || '<div class="small muted">—</div>'}</div></div>`}
      <div class="fgrid">
        <div class="f2">${fld('r-d', 'Date de la revue', `<input class="input" id="r-d" type="date" name="date" value="${v.date}" required>`)}${fld('r-m', 'Comment je me sens', `<select class="select" id="r-m" name="mood">${opts(MOODS, v.mood)}</select>`)}</div>
        ${fld('r-1', '✓ Ce qui a avancé cette semaine', `<textarea class="textarea" id="r-1" name="done" rows="4">${esc(v.done || '')}</textarea>`)}
        ${fld('r-2', "⚠ Difficultés, blocages, besoins d'aide", `<textarea class="textarea" id="r-2" name="blockers" rows="3">${esc(v.blockers || '')}</textarea>`)}
        ${fld('r-3', '→ Mes priorités pour la semaine prochaine', `<textarea class="textarea" id="r-3" name="next" rows="4">${esc(v.next || '')}</textarea>`)}
      </div>`,
    footer: footerHTML({ del: j && { act: 'delete-note', id: j.id }, ok: j ? 'Enregistrer' : 'Enregistrer ma revue' }),
    onSubmit: form => {
      const d = formData(form);
      const data = { date: d.date, mood: d.mood, done: d.done.trim(), blockers: d.blockers.trim(), next: d.next.trim() };
      commit(s => {
        if (j) { const cur = s.journal.find(x => x.id === j.id); if (cur) Object.assign(cur, data); }
        else s.journal.push(Object.assign({ id: uid('j'), type: 'review', projectId: null, createdAt: new Date().toISOString() }, data));
        if (!s.settings.lastReview || data.date > s.settings.lastReview) s.settings.lastReview = data.date;
      });
      toast(j ? 'Revue mise à jour.' : 'Revue enregistrée — bonne semaine !', 'success');
    }
  });
}

  'af-project': el => { AF().project = el.value; saveUI(); render(); },
  'af-sort': el => { AF().sort = el.value; saveUI(); refreshActions(); },
  'af-group': el => { AF().group = el.checked; saveUI(); refreshActions(); },
  'sel-one': el => { if (el.checked) SEL.add(el.dataset.id); else SEL.delete(el.dataset.id); refreshSel(); },
  'sel-all': el => { const box = $('#actions-results'); const ids = filterActions(box && box.dataset.project ? actionsOf(box.dataset.project) : S.actions, box && box.dataset.project || null).map(a => a.id); ids.forEach(id => el.checked ? SEL.add(id) : SEL.delete(id)); refreshSel(); },
  'sel-phase': el => { const [pid, ...rest] = el.dataset.k.split('|'), ph = rest.join('|'); const box = $('#actions-results'); filterActions(box && box.dataset.project ? actionsOf(box.dataset.project) : S.actions, box && box.dataset.project || null).filter(a => a.projectId === pid && (a.phase || '') === ph).forEach(a => el.checked ? SEL.add(a.id) : SEL.delete(a.id)); refreshSel(); },
  'g-base': el => { UI.gBase = el.checked; saveUI(); render(); },
  'profile-aliases': el => { const v = el.value.split(',').map(x => x.trim()).filter(Boolean); commit(s => { s.profile.aliases = v; }); toast('Tes noms sont enregistrés.', 'success'); },
  'skill-name': el => { const v = el.value.trim(); if (!v) return; commit(s => { const k = s.skills.find(x => x.id === el.dataset.id); if (k) k.name = v; }, { render: false }); toast('Compétence renommée.', 'success'); },
  'pf-status': el => { UI.pf.status = el.value; saveUI(); render(); },
  'pf-sort': el => { UI.pf.sort = el.value; saveUI(); render(); },
  'msp': el => { UI.msp = el.value; saveUI(); render(); },
  'jp': el => { UI.jp = el.value; saveUI(); render(); },
  'g-done': el => { UI.gDone = el.checked; saveUI(); render(); },
  'g-deps': el => { UI.gDeps = el.checked; saveUI(); render(); },
  'cal-pts': el => { UI.calPts = el.checked; saveUI(); render(); },
  'profile': el => { const k = el.name, val = el.value; commit(s => { s.profile[k] = val; }, { render: false }); renderSidebar(); applyLogos(); toast('Profil enregistré.', 'success'); }
};
const INP = {
  'af-q': el => { AF().q = el.value; saveUI(); refreshActions(); }
};
const SUB = {
  'quick-add': f => {
    const el = n => f.elements.namedItem(n);
    const title = el('title').value.trim(); if (!title) return;
    const pid = f.dataset.project || (el('projectId') && el('projectId').value);
    if (!pid || !proj(pid)) { toast('Choisis un projet.', 'error'); return; }
    const due = el('due').value || null;
    const phase = el('phase') ? el('phase').value.trim() : '';
    const a = { id: uid('a'), ref: nextRef(pid), projectId: pid, phase, title, result: '', description: '', status: 'todo', priority: 'normal', start: due ? minD(today(), due) : today(), due: due || addDays(today(), 7), progress: 0, effort: null, owner: S.profile.name || proj(pid).manager || '', milestoneId: null, dependsOn: [], checklist: [], skills: [], link: '', recur: '', next: '', nextDate: null, risk: '', decision: '', createdAt: new Date().toISOString(), doneAt: null };
    commit(s => s.actions.push(a));
    toast(`${a.ref} ajoutée (date cible ${fmtS(a.due)}).`, 'success', { label: 'Compléter', fn: () => editAction(a.id) });
    const inp = $('.quickadd input[name=title]'); if (inp) inp.focus();
  },
  'add-note': f => {
    const el = n => f.elements.namedItem(n);
    const text = el('text').value.trim(); if (!text) return;
    const pid = f.dataset.project || (el('projectId') && el('projectId').value) || null;
    commit(s => s.journal.push({ id: uid('j'), type: 'note', date: el('date').value || today(), projectId: pid, text, createdAt: new Date().toISOString() }));
    toast('Note ajoutée au journal.', 'success');
  }
};
function refreshActions() {
  const box = $('#actions-results'); if (!box) { render(); return; }
  box.innerHTML = actionsResults(box.dataset.project || null);
  const ch = $('.fchips'), nc = filterChips(box.dataset.project || null);
  if (ch) { if (nc) ch.outerHTML = nc; else ch.remove(); } else if (nc) $('.quickadd')?.insertAdjacentHTML('beforebegin', nc);
}
function refreshSel() {
  refreshActions();
  const bb = $('.bulkbar'); if (bb) bb.outerHTML = bulkBar();
}

document.addEventListener('click', e => {
  const inMenu = e.target.closest('.menu-wrap');
  if (!inMenu) $$('.menu.open').forEach(m => m.classList.remove('open'));
  if (document.body.classList.contains('side-open') && (!e.target.closest('#sidebar, .hamburger') || e.target.closest('#sidebar a'))) document.body.classList.remove('side-open');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const inner = e.target.closest('input, select, textarea, label, a[href]');
  if (inner && !inner.matches('[data-act]') && el.contains(inner) && inner !== el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (el.closest('.menu')) $$('.menu.open').forEach(m => m.classList.remove('open'));
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pcard[data-act], .kcard[data-act], .phase-h[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); if (SUB[f.dataset.submit]) SUB[f.dataset.submit](f, e); });
$('#file-import').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSONFile(f); e.target.value = ''; });
$('#xlsx-import').addEventListener('change', e => { const f = e.target.files[0]; if (f) importXLSXFile(f); e.target.value = ''; });
$('#logo-input').addEventListener('change', e => { const f = e.target.files[0], k = e.target.dataset.k; if (f && (k === 'natran' || k === 'istp')) readLogo(f, k); e.target.value = ''; });

/* Glisser-déposer : kanban (statut) et calendrier (date) */
let dnd = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-dnd]'); if (!el) return;
  dnd = el.dataset.dnd; hideTip();
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dnd);
  setTimeout(() => el.classList.add('dragging'), 0);
});
document.addEventListener('dragend', () => { $$('.dragging, .over').forEach(x => x.classList.remove('dragging', 'over')); dnd = null; });
document.addEventListener('dragover', e => {
  if (!dnd) return;
  const z = e.target.closest('[data-drop-status],[data-drop-date]'); if (!z) return;
  if (z.dataset.dropStatus && !dnd.startsWith('a:')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.over').forEach(x => { if (x !== z) x.classList.remove('over'); }); z.classList.add('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop-status],[data-drop-date]'); if (!z || !dnd) return;
  e.preventDefault();
  const [k, id] = dnd.split(':'); dnd = null;
  if (z.dataset.dropStatus) {
    const a = act(id); if (!a || a.status === z.dataset.dropStatus) return render();
    commit(() => applyStatus(act(id), z.dataset.dropStatus));
    toast(`« ${a.title} » → ${STATUS[z.dataset.dropStatus].label}`, 'success', { label: 'Annuler', fn: undo });
  } else {
    const d = z.dataset.dropDate;
    if (k === 'a') {
      const a = act(id); if (!a || a.due === d) return render();
      commit(() => { const x = act(id); const delta = x.due ? diffDays(x.due, d) : 0; x.due = d; if (x.start) x.start = addDays(x.start, delta); });
      toast(`Date cible déplacée au ${fmtS(d)}.`, 'success', { label: 'Annuler', fn: undo });
    } else {
      const m = mil(id); if (!m || m.date === d) return render();
      commit(() => { mil(id).date = d; });
      toast(`Jalon déplacé au ${fmtS(d)}.`, 'success', { label: 'Annuler', fn: undo });
    }
  }
});

/* Recherche globale */
const si = $('#search-input'), sp = $('#search-pop');
let sres = [], ssel = 0;
function doSearch(q) {
  q = norm(q.trim()); if (!q) return [];
  const out = [];
  S.projects.forEach(p => { if (norm(`${p.ref} ${p.name} ${p.domain} ${p.manager} ${p.description}`).includes(q)) out.push({ k: 'Projet', t: (p.ref ? p.ref + ' · ' : '') + p.name, c: colorOf(p), run: () => go(`#/projet/${p.id}`) }); });
  S.milestones.forEach(m => { if (norm(`${m.ref} ${m.title} ${m.description}`).includes(q)) out.push({ k: 'Jalon · ' + fmtS(m.date), t: '◆ ' + (m.ref ? m.ref + ' · ' : '') + m.title, c: colorOf(proj(m.projectId)), run: () => editMilestone(m.id) }); });
  S.actions.forEach(a => { if (norm(`${a.ref} ${a.title} ${a.result} ${a.owner} ${a.phase} ${a.next} ${a.description} ${a.checklist.map(c => c.text).join(' ')}`).includes(q)) out.push({ k: (a.ref ? a.ref + ' · ' : '') + (a.owner || proj(a.projectId)?.name || ''), t: a.title, c: colorOf(proj(a.projectId)), run: () => editAction(a.id) }); });
  S.journal.forEach(j => { const txt = j.type === 'review' ? `${j.done || ''} ${j.blockers || ''} ${j.next || ''}` : (j.text || ''); if (norm(txt).includes(q)) out.push({ k: 'Journal · ' + fmtS(j.date), t: txt.replace(/\s+/g, ' ').slice(0, 80), c: 'var(--muted)', run: () => go('#/journal') }); });
  return out.slice(0, 14);
}
function paintSearch() {
  if (!si.value.trim()) { sp.classList.remove('open'); return; }
  sp.innerHTML = sres.length ? sres.map((r, i) => `<div class="res ${i === ssel ? 'sel' : ''}" data-i="${i}" role="option"><span class="dot" style="--c:${r.c}"></span><span class="t">${esc(r.t)}</span><span class="k">${esc(r.k)}</span></div>`).join('') : '<div class="res muted">Aucun résultat</div>';
  sp.classList.add('open');
}
si.addEventListener('input', () => { sres = doSearch(si.value); ssel = 0; paintSearch(); });
si.addEventListener('focus', () => { if (si.value.trim()) { sres = doSearch(si.value); paintSearch(); } });
si.addEventListener('blur', () => setTimeout(() => sp.classList.remove('open'), 150));
si.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); ssel = Math.min(sres.length - 1, ssel + 1); paintSearch(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); ssel = Math.max(0, ssel - 1); paintSearch(); }
  else if (e.key === 'Enter') { e.preventDefault(); const r = sres[ssel]; if (r) { si.value = ''; sp.classList.remove('open'); si.blur(); r.run(); } }
  else if (e.key === 'Escape') { si.value = ''; sp.classList.remove('open'); si.blur(); }
});
sp.addEventListener('mousedown', e => { const el = e.target.closest('.res[data-i]'); if (!el) return; e.preventDefault(); const r = sres[+el.dataset.i]; si.value = ''; sp.classList.remove('open'); si.blur(); r && r.run(); });

/* Raccourcis clavier */
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
  if (e.key === 'Escape') {
    if (popClose) { closePop(); return; }
    if (modalOpen()) { closeModal(); return; }
    $$('.menu.open').forEach(m => m.classList.remove('open'));
    document.body.classList.remove('side-open');
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); toast('Sauvegardé ✓', 'success'); return; }
  if (typing || modalOpen()) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); si.focus(); }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); editAction(null); }
});

/* =====================================================================
   10. Démarrage
   ===================================================================== */
function init() {
  loadState();
  applyTheme();
  $('.hamburger').innerHTML = ic('menu');
  $('.search .sico').outerHTML = ic('search', 16);
  $('.plus-ic').outerHTML = ic('plus', 17, 2.4);
  $('#new-menu').innerHTML = [
    ['new-action', 'list', 'Action', 'N'], ['new-project', 'folder', 'Projet'], ['tpl-istp', 'school', 'Parcours ISTP (modèle)'], ['new-milestone', 'flag', 'Jalon'], ['new-note', 'book', 'Note de journal'], ['point-hebdo', 'send', 'Point hebdo'], ['weekly-review', 'sparkle', 'Revue hebdomadaire']
  ].map(([a, i, l, k]) => `<button type="button" data-act="${a}"><span class="mi">${ic(i, 16)}</span> ${l}${k ? `<span class="hint">${k}</span>` : ''}</button>`).join('');
  parseRoute();
  PREV_VISIT = UI.lastVisit; UI.lastVisit = new Date().toISOString(); saveUI();
  logProgress();
  render();
  saveNow();
  snapshotDaily();
  FileSync.init();
  if (bootNotice) toast(bootNotice, 'success');
  let day = today();
  setInterval(() => { if (today() !== day) { day = today(); logProgress(); snapshotDaily(); scheduleSave(); render(); } }, 60000);
}
init();
})();
</script>

function paintTheme() {
  const t = S.settings.theme, b = $('#theme-btn');
  b.innerHTML = ic(t === 'dark' ? 'moon' : t === 'light' ? 'sun' : 'auto');
  b.title = 'Thème : ' + { auto: 'automatique (système)', light: 'clair', dark: 'sombre' }[t || 'auto'];
}

function toast(msg, type = '', action) {
  const root = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  root.appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : 4200);
  while (root.children.length > 4) root.firstChild.remove();
}

/* ---------- Info-bulles ---------- */
const tipEl = $('#tooltip');
function showTip(text, x, y) {
  const [h, ...rest] = String(text).split('\n');
  tipEl.innerHTML = `<b>${esc(h)}</b>${rest.map(l => `<div>${esc(l)}</div>`).join('')}`;
  tipEl.classList.add('show'); moveTip(x, y);
}
function moveTip(x, y) {
  const r = tipEl.getBoundingClientRect();
  let nx = x + 14, ny = y + 16;
  if (nx + r.width > innerWidth - 8) nx = x - r.width - 14;
  if (ny + r.height > innerHeight - 8) ny = y - r.height - 14;
  tipEl.style.transform = `translate(${Math.max(4, nx)}px,${Math.max(4, ny)}px)`;
}
const hideTip = () => tipEl.classList.remove('show');
let tipTarget = null;
document.addEventListener('pointerover', e => {
  if (drag) return;
  const el = e.target.closest('[data-tip]');
  if (el === tipTarget) return;
  tipTarget = el;
  if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('pointermove', e => { if (tipTarget && !drag) moveTip(e.clientX, e.clientY); }, { passive: true });
document.addEventListener('scroll', () => { if (!drag) { hideTip(); tipTarget = null; } }, true);

/* ---------- Modales ---------- */
let modalCleanup = null;
function openModal({ title, body, footer, size = '', onSubmit, onMount }) {
  closeModal();
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bd"><form class="modal ${size}" autocomplete="off"><header class="modal-h"><h3>${title}</h3><button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Fermer">${ic('x')}</button></header><div class="modal-b">${body}</div><footer class="modal-f">${footer ?? footerHTML()}</footer></form></div>`;
  const form = $('form', root), bd = $('.modal-bd', root);
  let dirty = false;
  form.addEventListener('input', () => { dirty = true; });
  form.addEventListener('submit', e => { e.preventDefault(); if (onSubmit && onSubmit(form, e) === false) return; closeModal(); });
  $('[data-close]', root).addEventListener('click', closeModal);
  $$('[data-cancel]', root).forEach(b => b.addEventListener('click', closeModal));
  bd.addEventListener('mousedown', e => { if (e.target === bd && !dirty) closeModal(); });
  const prev = document.activeElement;
  modalCleanup = () => { try { prev && prev.focus && prev.focus({ preventScroll: true }); } catch (_) {} };
  document.body.style.overflow = 'hidden';
  if (onMount) onMount(form);
  const first = form.querySelector('[autofocus]') || form.querySelector('.modal-b input:not([type=checkbox]):not([type=radio]):not([type=hidden]), .modal-b textarea, .modal-f .btn-primary');
  setTimeout(() => first && first.focus(), 40);
  return form;
}
function closeModal() {
  const root = $('#modal-root');
  if (!root.firstChild) return;
  root.innerHTML = ''; document.body.style.overflow = '';
  const c = modalCleanup; modalCleanup = null; if (c) c();
}
const modalOpen = () => !!$('#modal-root').firstChild;
function confirmDialog({ title, message, ok = 'Confirmer', danger = false }) {
  return new Promise(res => {
    let answered = false;
    openModal({
      title, size: 'narrow',
      body: `<p style="color:var(--text-2);line-height:1.6">${message}</p>`,
      footer: `<span class="spacer"></span><button type="button" class="btn" data-cancel>Annuler</button><button type="submit" class="btn ${danger ? 'btn-crit' : 'btn-primary'}">${ok}</button>`,
      onSubmit: () => { answered = true; res(true); }
    });
    const prev = modalCleanup;
    modalCleanup = () => { if (prev) prev(); if (!answered) res(false); };
  });
}

function hero() {
  const P = S.profile, t = today();

  const j = P.goalDate ? diffDays(t, P.goalDate) : null;
  let journey = '';
  if (P.startDate && P.goalDate && P.goalDate > P.startDate) {
    const tot = diffDays(P.startDate, P.goalDate);
    const pos = d => clamp(diffDays(P.startDate, d) / tot * 100, 0, 100);
    const pct = Math.round(pos(t));
    const posts = S.milestones.filter(m => m.key && m.date >= P.startDate && m.date <= P.goalDate).sort(byDate)
      .map(m => `<span class="j-post ${m.done ? 'done' : ''}" style="left:${pos(m.date)}%" data-tip="◆ ${esc(m.title)}\n${fmtL(m.date)}\n${esc(proj(m.projectId)?.name || '')} · ${msLabel(msStatus(m))}"></span>`).join('');
    journey = `<div class="journey">

      <div class="j-legend"><span>Début · <b>${fmtMY(P.startDate)}</b></span><span class="muted" style="color:#9FB0C6">Les bornes jaunes = jalons clés</span><span>${esc(P.goalLabel)} · <b>${fmtMY(P.goalDate)}</b></span></div>

function projectCard(p) {

  const next = milestonesOf(p.id).find(m => !m.done);
  const od = as.filter(isOverdue).length;
  return `<article class="pcard" data-act="open-project" data-id="${p.id}" style="--c:${colorOf(p)}" tabindex="0" role="link" aria-label="Ouvrir ${esc(p.name)}">
    <div class="pcard-top">${p.code ? `<span class="pcode">${esc(p.code)}</span>` : ''}${ctxBadge(p.context)}<span class="spacer"></span>${pstChip(p.status)}</div>

/* ---------- Gantt ---------- */
const ZOOM = { day: { dw: 34, label: 'Jours' }, week: { dw: 16, label: 'Semaines' }, month: { dw: 5, label: 'Mois' } };
const RH = 38;
function ganttRows(projectId) {
  const rows = [];
  const projects = projectId ? [proj(projectId)].filter(Boolean) : sortedProjects().filter(p => UI.gDone || p.status !== 'done');
  for (const p of projects) {
    const acts = sortActions(actionsOf(p.id).filter(a => UI.gDone || a.status !== 'done'), 'start');
    if (!projectId) rows.push({ type: 'project', p });
    else if (milestonesOf(p.id).length) rows.push({ type: 'ms', p });
    if (projectId || !UI.gCollapsed[p.id]) acts.forEach(a => rows.push({ type: 'action', a, p }));
  }
  return rows;
}
function ganttHTML(projectId) {
  const zoom = ZOOM[UI.gz] ? UI.gz : 'week', dw = ZOOM[zoom].dw, t = today();
  const rows = ganttRows(projectId);
  let lo = t, hi = t;
  const see = d => { if (!d) return; if (d < lo) lo = d; if (d > hi) hi = d; };
  rows.forEach(r => { const sp = r.type === 'action' ? actionSpan(r.a) : projectSpan(r.p); if (sp) { see(sp[0]); see(sp[1]); } });
  const start = startOfWeek(addDays(lo, zoom === 'month' ? -21 : -7));
  let end = addDays(hi, zoom === 'day' ? 14 : zoom === 'week' ? 28 : 60);
  const minDays = { day: 56, week: 182, month: 420 }[zoom];
  if (diffDays(start, end) < minDays) end = addDays(start, minDays);
  const days = Math.ceil((diffDays(start, end) + 1) / 7) * 7;
  end = addDays(start, days - 1);
  const W = days * dw, X = d => diffDays(start, d) * dw;

  let months = '', mlines = '';
  for (let d = start; d <= end;) {
    const me = minD(lastOfMonth(d), end), w = (diffDays(d, me) + 1) * dw, dd = parse(d);
    const label = w > 110 ? fmtMY(d) : w > 44 ? cap(MONTHS_S[dd.getMonth()]) + (w > 70 ? ' ' + String(dd.getFullYear()).slice(2) : '') : '';
    months += `<div style="width:${w}px" title="${fmtMY(d)}">${label}</div>`;
    if (d !== start) mlines += `<div class="g-mline" style="left:${X(d)}px"></div>`;
    d = addDays(me, 1);
  }
  let units = '';
  if (zoom === 'day') for (let i = 0; i < days; i++) { const d = addDays(start, i), wd = dow(d); units += `<div class="${wd === 0 || wd === 6 ? 'we' : ''} ${d === t ? 'td' : ''}" style="width:${dw}px"><small>${'DLMMJVS'[wd]}</small>${parse(d).getDate()}</div>`; }
  else for (let i = 0; i < days; i += 7) { const d = addDays(start, i), cur = t >= d && t <= addDays(d, 6); units += `<div class="${cur ? 'td' : ''}" style="width:${7 * dw}px" title="Semaine ${isoWeek(d)} · ${fmtS(d)}">${zoom === 'week' ? `S${isoWeek(d)} <small>${fmtDM(d)}</small>` : isoWeek(d)}</div>`; }
  const bg = zoom === 'month'
    ? `repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px ${7 * dw}px)`

const ganttOffset = sc => clamp(Math.round((sc.clientWidth - parseFloat(getComputedStyle(sc.closest('.gantt')).getPropertyValue('--lw') || 290)) / 4), 24, 160);

VIEWS.gantt = () => ({ title: 'Gantt', sub: 'Planification de tous les projets · glisser-déposer pour replanifier', html: ganttHTML(null) });

/* Glisser-déplacer des barres du Gantt */
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button !== 0) return;
  const g = el.closest('.gantt'); if (!g) return;
  const kind = el.dataset.drag, id = el.dataset.id;
  const item = kind === 'action' ? act(id) : mil(id); if (!item) return;
  const mode = e.target.classList.contains('g-h') ? (e.target.classList.contains('l') ? 'l' : 'r') : 'move';
  drag = { el, kind, id, mode, item, dw: +g.dataset.dw, x0: e.clientX, left0: parseFloat(el.style.left), width0: parseFloat(el.style.width) || 16, n: 0, moved: false,
    span: kind === 'action' ? actionSpan(item) : [item.date, item.date], out: $(`.g-out[data-for="${id}"]`, g) };
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0;
  if (Math.abs(dx) > 3) drag.moved = true;
  if (!drag.moved) return;
  const { dw, mode, el } = drag;
  const n = Math.round(dx / dw); drag.n = n;
  let left = drag.left0, width = drag.width0;
  if (mode === 'move') left = drag.left0 + n * dw;
  else if (mode === 'r') width = Math.max(dw, drag.width0 + n * dw);
  else { left = Math.min(drag.left0 + n * dw, drag.left0 + drag.width0 - dw); width = drag.width0 - (left - drag.left0); }
  el.style.left = left + 'px';
  if (drag.kind === 'action') el.style.width = width + 'px';
  if (drag.out) drag.out.style.left = (left + width + 8) + 'px';
  el.classList.add('dragging');
  const [s, en] = newSpan();
  showTip(drag.kind === 'action' ? `${drag.item.title}\n${fmtS(s, true)} → ${fmtS(en, true)} · ${plural(diffDays(s, en) + 1, 'jour')}` : `◆ ${drag.item.title}\n${fmtL(s)}`, e.clientX, e.clientY);
});
function newSpan() {
  let [s, e] = drag.span; const n = drag.n;
  if (drag.mode === 'move') { s = addDays(s, n); e = addDays(e, n); }

  commit(() => {

    if (d.kind === 'action') { it.start = s; it.due = e; } else it.date = s;

/* ---------- Planning (calendrier) ---------- */
function calendarHTML(projectId) {
  const mode = UI.calMode === 'week' ? 'week' : 'month', t = today(), anchor = UI.calAnchor || t;
  const acts = projectId ? actionsOf(projectId) : S.actions;
  const mss = projectId ? milestonesOf(projectId) : S.milestones;
  const due = {}, msd = {};
  acts.forEach(a => { if (a.due) (due[a.due] = due[a.due] || []).push(a); });
  mss.forEach(m => (msd[m.date] = msd[m.date] || []).push(m));

  const dayItems = d => [...(msd[d] || []).map(itemM), ...sortActions(due[d] || [], 'priority').map(a => itemA(a))];
  let title, grid;
  if (mode === 'month') {
    const first = firstOfMonth(anchor), gs = startOfWeek(first), month = parse(first).getMonth();
    const weeks = Math.ceil((diffDays(gs, lastOfMonth(first)) + 1) / 7);
    title = fmtMY(first);
    let cells = ['Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.', 'Dim.'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(gs, i), wd = dow(d), items = dayItems(d), max = 3;
      cells += `<div class="cal-cell ${parse(d).getMonth() !== month ? 'other' : ''} ${d === t ? 'today' : ''} ${wd === 0 || wd === 6 ? 'we' : ''}" data-drop-date="${d}" data-act="cal-day" data-date="${d}" aria-label="${fmtL(d)}"><div class="cal-d">${parse(d).getDate()}</div>${items.slice(0, max).join('')}${items.length > max ? `<div class="cal-more">+ ${items.length - max} autre${items.length - max > 1 ? 's' : ''}</div>` : ''}</div>`;
    }
    grid = `<div class="cal">${cells}</div>`;
  } else {
    const ws = startOfWeek(anchor);
    title = `Semaine ${isoWeek(ws)} · ${fmtS(ws)} → ${fmtS(addDays(ws, 6), true)}`;
    let head = '', cells = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i), wd = dow(d);
      head += `<div class="cal-dow"><div class="cal-wh"><small>${DAYS_S[wd]}</small><b style="font-size:15px;color:${d === t ? 'var(--natran-text)' : 'var(--text)'}">${parse(d).getDate()}</b></div></div>`;

      const items = dayItems(d);

    <div class="row"><button type="button" class="btn btn-icon btn-sm" data-act="cal-nav" data-v="-1" aria-label="Précédent">${ic('chevL')}</button><button type="button" class="btn btn-sm" data-act="cal-nav" data-v="0">Aujourd'hui</button><button type="button" class="btn btn-icon btn-sm" data-act="cal-nav" data-v="1" aria-label="Suivant">${ic('chevR')}</button></div>
    <h3>${title}</h3><span class="spacer"></span>
    <div class="seg"><button type="button" class="${mode === 'month' ? 'on' : ''}" data-act="cal-mode" data-v="month">Mois</button><button type="button" class="${mode === 'week' ? 'on' : ''}" data-act="cal-mode" data-v="week">Semaine</button></div>
    <button type="button" class="btn btn-sm btn-primary" data-act="new-action" data-project="${projectId || ''}">${ic('plus', 15)} Action</button>
  </div>${grid}
  <div class="legend mt"><span class="k"><span class="dot" style="--c:var(--s1);width:8px;height:8px"></span> Échéance d'action (couleur du projet)</span><span class="k"><span class="dia" style="width:8px;height:8px"></span> Jalon</span><span class="k" style="color:var(--critical-text)">▎ En retard</span><span class="muted">· Clique sur un jour pour le détail · glisse un élément pour changer sa date.</span></div>`;

/* ---------- Jalons ---------- */
function milestonesBlock(projectId) {
  const f = UI.msf;
  let list = (projectId ? milestonesOf(projectId) : S.milestones.slice().sort(byDate));
  if (!projectId && UI.msp && UI.msp !== 'all') list = list.filter(m => m.projectId === UI.msp);
  const all = list;
  if (f === 'upcoming') list = list.filter(m => !m.done);
  else if (f === 'late') list = list.filter(m => msStatus(m) === 'late');
  else if (f === 'done') list = list.filter(m => m.done);
  const cnt = k => ({ upcoming: all.filter(m => !m.done).length, late: all.filter(m => msStatus(m) === 'late').length, done: all.filter(m => m.done).length, all: all.length }[k]);
  const chip = (k, l) => `<button type="button" class="fchip ${f === k ? 'on' : ''}" data-act="msf" data-v="${k}">${l} <span style="opacity:.7">${cnt(k)}</span></button>`;
  let lastMonth = '', html = '';
  for (const m of list) {
    const mo = m.date.slice(0, 7);
    if (mo !== lastMonth) { html += `<div class="mtl-month">${fmtMY(m.date)}</div>`; lastMonth = mo; }
    const p = proj(m.projectId), st = msStatus(m), linked = S.actions.filter(a => a.milestoneId === m.id);
    const lp = linked.length ? Math.round(linked.reduce((s, a) => s + actionProgress(a), 0) / linked.length) : null;

/* =====================================================================
   7. Graphique : courbe d'avancement
   ===================================================================== */
function mountCharts(root) { $$('[data-chart="progress"]', root || document).forEach(el => { const p = proj(el.dataset.id); if (p) progressChart(el, p); }); }
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => mountCharts(), 150); });
function progressChart(el, p) {
  const W = Math.max(280, el.clientWidth), H = 230, m = { t: 22, r: 70, b: 28, l: 42 };
  const sp = projectSpan(p), s0 = p.start || sp?.[0], e0 = p.end || sp?.[1];
  if (!s0 || !e0 || e0 <= s0) { el.innerHTML = `<div class="empty" style="min-height:200px">${ic('calendar', 22)}<span>Renseigne les dates de début et de fin du projet pour afficher la courbe.</span></div>`; return; }
  const log = S.progressLog[p.id] || {};
  const pts = Object.keys(log).sort().map(d => [d, log[d]]);
  const t = today();
  const x0 = minD(s0, pts[0]?.[0]), x1 = maxD(e0, t, pts.length ? pts[pts.length - 1][0] : null);
  const span = Math.max(1, diffDays(x0, x1)), iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = d => m.l + diffDays(x0, d) / span * iw, Y = v => m.t + (1 - v / 100) * ih;
  let g = '';
  [0, 25, 50, 75, 100].forEach(v => { g += `<line class="${v === 0 ? 'base-l' : 'grid-l'}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end" class="tnum">${v} %</text>`; });
  const months = []; for (let d = firstOfMonth(x0) < x0 ? addMonths(x0, 1) : firstOfMonth(x0); d <= x1; d = addMonths(d, 1)) months.push(d);
  const step = Math.max(1, Math.ceil(months.length / Math.max(2, Math.floor(iw / 64))));
  months.forEach((d, i) => { if (i % step) return; const dd = parse(d); g += `<text x="${X(d)}" y="${H - 8}" text-anchor="middle">${MONTHS_S[dd.getMonth()]}${dd.getMonth() === 0 ? ' ' + String(dd.getFullYear()).slice(2) : ''}</text>`; });
  if (t >= x0 && t <= x1) g += `<line class="tl" x1="${X(t)}" x2="${X(t)}" y1="${m.t - 4}" y2="${H - m.b}"/><text x="${X(t)}" y="${m.t - 9}" text-anchor="middle" class="lbl">Aujourd'hui</text>`;
  let plan = `M${X(x0)},${Y(0)} L${X(s0)},${Y(0)} L${X(e0)},${Y(100)}`; if (x1 > e0) plan += ` L${X(x1)},${Y(100)}`;
  const real = pts.map(([d, v], i) => `${i ? 'L' : 'M'}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  const area = pts.length > 1 ? `${real} L${X(last[0]).toFixed(1)},${Y(0)} L${X(pts[0][0]).toFixed(1)},${Y(0)} Z` : '';
  const exNow = expectedAt(p, last ? last[0] : t);
  const lblY = last ? (Math.abs(Y(last[1]) - Y(exNow ?? -100)) < 14 ? Y(last[1]) + 16 : Y(last[1]) + 4) : 0;
  el.style.setProperty('--c', colorOf(p));
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Courbe d'avancement : réel ${last ? last[1] : 0} %, prévu ${expectedProgress(p) ?? '—'} %">${g}
    <path class="plan" d="${plan}"/>${area ? `<path class="area" d="${area}"/>` : ''}${real ? `<path class="real" d="${real}"/>` : ''}
    ${last ? `<circle class="pt" cx="${X(last[0])}" cy="${Y(last[1])}" r="5"/><text class="lbl" x="${X(last[0]) + 10}" y="${lblY}">Réel ${last[1]} %</text>` : ''}
    <text class="lbl" x="${Math.min(X(e0), W - m.r)}" y="${Y(100) - 8}" text-anchor="end">Prévu</text>
    <g class="hov" style="display:none"><line class="xh" y1="${m.t}" y2="${H - m.b}"/><circle class="pt" r="5"/></g>
    <rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg = $('svg', el), hov = $('.hov', svg), xh = $('.xh', hov), dotc = $('circle', hov);
  $('.hit', svg).addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect(), mx = clamp(e.clientX - r.left, m.l, m.l + iw);
    const d = addDays(x0, Math.round((mx - m.l) / iw * span));
    let rv = null; for (const [dd, v] of pts) { if (dd <= d) rv = v; else break; }
    const pv = expectedAt(p, d);
    hov.style.display = ''; xh.setAttribute('x1', X(d)); xh.setAttribute('x2', X(d));
    if (rv != null && d <= (last ? last[0] : t)) { dotc.style.display = ''; dotc.setAttribute('cx', X(d)); dotc.setAttribute('cy', Y(rv)); } else dotc.style.display = 'none';
    showTip(`${cap(fmtL(d))}\nRéel : ${rv != null && d <= t ? rv + ' %' : '—'}\nPrévu : ${pv != null ? pv + ' %' : '—'}`, e.clientX, e.clientY);
  });
  $('.hit', svg).addEventListener('pointerleave', () => { hov.style.display = 'none'; hideTip(); });
}

      else {

async function deleteProject(id) {
  const p = proj(id); if (!p) return;

  if (!ok) return;
  commit(s => {
    s.projects = s.projects.filter(x => x.id !== id);
    const gone = new Set(s.actions.filter(a => a.projectId === id).map(a => a.id));
    s.actions = s.actions.filter(a => a.projectId !== id);
    s.actions.forEach(a => { a.dependsOn = a.dependsOn.filter(x => !gone.has(x)); });
    s.milestones = s.milestones.filter(m => m.projectId !== id);
    s.journal.forEach(j => { if (j.projectId === id) j.projectId = null; });
  }, { render: false });
  if (R.page === 'projet') go('#/projets'); else render();

function weeklyReview(id) {
  const j = id ? S.journal.find(x => x.id === id) : null;
  const t = today(), w0 = addDays(t, -7), w1 = addDays(t, 7);
  const doneW = S.actions.filter(a => a.status === 'done' && a.doneAt && a.doneAt >= w0);
  const late = S.actions.filter(isOverdue).sort(byDue);
  const next = S.actions.filter(a => a.status !== 'done' && a.due && a.due >= t && a.due <= w1).sort(byDue);
  const blocked = S.actions.filter(a => a.status === 'blocked');
  const msN = S.milestones.filter(m => !m.done && m.date >= t && m.date <= addDays(t, 14)).sort(byDate);
  const bullets = list => list.map(a => '• ' + a.title).join('\n');
  const v = j || { date: t, mood: 'good', done: bullets(doneW), blockers: bullets(blocked), next: bullets([...late, ...next].slice(0, 8)) };
  const col = (title, list, tone) => `<div class="kpi"><div class="l" style="margin-bottom:6px">${title} · <b>${list.length}</b></div>${list.slice(0, 5).map(x => `<div class="small" style="display:flex;gap:6px;align-items:center;padding:2px 0;${tone ? 'color:' + tone : ''}"><span class="dot" style="--c:${colorOf(proj(x.projectId))};width:7px;height:7px"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</span></div>`).join('') || '<div class="small muted">—</div>'}${list.length > 5 ? `<div class="small muted">+ ${list.length - 5} autres</div>` : ''}</div>`;
  openModal({
    title: j ? 'Revue hebdomadaire' : 'Ma revue de la semaine', size: 'wide',
    body: `${j ? '' : `<p class="muted" style="margin-bottom:12px">Voici ce qui s'est passé ces 7 derniers jours. Complète les trois questions, c'est rapide.</p>
      <div class="grid g-4" style="gap:10px;margin-bottom:16px">${col('✓ Terminées', doneW, '')}${col('⚑ En retard', late, 'var(--critical-text)')}${col('→ À venir 7 j', next, '')}<div class="kpi"><div class="l" style="margin-bottom:6px">◆ Jalons 14 j · <b>${msN.length}</b></div>${msN.slice(0, 5).map(m => `<div class="small" style="padding:2px 0">${esc(m.title)} · ${fmtS(m.date)}</div>`).join('') || '<div class="small muted">—</div>'}</div></div>`}
      <div class="fgrid">
        <div class="f2"><div class="field"><label for="r-d">Date de la revue</label><input class="input" id="r-d" type="date" name="date" value="${v.date}" required></div><div class="field"><label for="r-m">Comment je me sens</label><select class="select" id="r-m" name="mood">${opts(MOODS, v.mood)}</select></div></div>
        <div class="field"><label for="r-1">✓ Ce qui a avancé cette semaine</label><textarea class="textarea" id="r-1" name="done" rows="4">${esc(v.done || '')}</textarea></div>
        <div class="field"><label for="r-2">⚠ Difficultés, blocages, besoins d'aide</label><textarea class="textarea" id="r-2" name="blockers" rows="3">${esc(v.blockers || '')}</textarea></div>
        <div class="field"><label for="r-3">→ Mes priorités pour la semaine prochaine</label><textarea class="textarea" id="r-3" name="next" rows="4">${esc(v.next || '')}</textarea></div>
      </div>`,
    footer: footerHTML({ del: j && { act: 'delete-note', id: j.id }, ok: j ? 'Enregistrer' : 'Enregistrer ma revue' }),
    onSubmit: form => {

      commit(s => {

  'import-json': () => $('#file-import').click(),
  'file-link': () => FileSync.link(),
  'file-open': () => FileSync.openFrom(),
  'file-reconnect': () => FileSync.reconnect(),
  'file-unlink': () => FileSync.unlink(),
  'snap-restore': async el => {
    const s = readSnaps()[+el.dataset.i]; if (!s) return;
    const ok = await confirmDialog({ title: 'Restaurer ce point ?', message: `Les données reviendront à l'état du <b>${fmtL(s.date)}</b> (${plural(s.counts.p, 'projet')}, ${plural(s.counts.a, 'action')}). Tu pourras annuler juste après.`, ok: 'Restaurer' });
    if (ok) replaceState(s.data, 'Point de restauration appliqué.');
  },
  'logo-upload': el => { const i = $('#logo-input'); i.dataset.k = el.dataset.k; i.click(); },
  'logo-clear': el => { commit(s => { s.settings.logos[el.dataset.k] = null; }); resolveLogos(); },
  'demo-keep': () => { commit(s => { s.settings.demo = false; }, { undo: false }); toast("C'est noté ! Tu pourras tout effacer depuis Paramètres → Données."); },
  'demo-clear': async () => {
    const ok = await confirmDialog({ title: 'Repartir de zéro ?', message: 'Tous les projets, actions, jalons et entrées de journal seront effacés. Ton profil, tes logos et le thème sont conservés. Tu pourras annuler juste après.', ok: 'Tout effacer', danger: true });
    if (!ok) return;
    const e = emptyState(); e.profile = S.profile; e.settings = Object.assign({}, S.settings, { demo: false, lastReview: null });
    replaceState(e, 'Tout est prêt : crée ton premier projet !');
    go('#/dashboard');
  },
  'load-demo': async () => {
    const ok = await confirmDialog({ title: "Charger l'exemple ?", message: "Tes données actuelles seront remplacées par les données d'exemple. Pense à exporter une sauvegarde si besoin. Tu pourras annuler juste après.", ok: "Charger l'exemple" });
    if (ok) { const d = demoState(); d.profile = S.profile; d.settings.logos = S.settings.logos; d.settings.theme = S.settings.theme; replaceState(d, "Données d'exemple chargées."); go('#/dashboard'); }
  },
  'undo': undo
};
const CHG = {
  'toggle-done': el => {
    const a = act(el.dataset.id); if (!a) return;
    const on = el.checked;
    commit(() => applyStatus(act(a.id), on ? 'done' : (a.prevStatus && a.prevStatus !== 'done' ? a.prevStatus : 'todo')));
    if (on) toast(`« ${a.title} » terminée ✓`, 'success', { label: 'Annuler', fn: undo });
  },
  'set-status': el => { commit(() => applyStatus(act(el.dataset.id), el.value)); },
  'toggle-ms': el => { const on = el.checked; commit(() => { const m = mil(el.dataset.id); if (m) m.done = on; }); if (on) toast('Jalon atteint, bravo !', 'success'); },
  'af-prio': el => { UI.af.prio = el.value; saveUI(); refreshActions(); },
  'af-project': el => { UI.af.project = el.value; saveUI(); render(); },
  'af-sort': el => { UI.af.sort = el.value; saveUI(); refreshActions(); },
  'af-hidedone': el => { UI.af.hideDone = el.checked; saveUI(); refreshActions(); },
  'pf-status': el => { UI.pf.status = el.value; saveUI(); render(); },
  'pf-sort': el => { UI.pf.sort = el.value; saveUI(); render(); },
  'msp': el => { UI.msp = el.value; saveUI(); render(); },
  'jp': el => { UI.jp = el.value; saveUI(); render(); },
  'g-done': el => { UI.gDone = el.checked; saveUI(); render(); },
  'g-deps': el => { UI.gDeps = el.checked; saveUI(); render(); },
  'profile': el => { const k = el.name, val = el.value; commit(s => { s.profile[k] = val; }, { render: false }); renderSidebar(); toast('Profil enregistré.', 'success'); }
};
const INP = {
  'af-q': el => { UI.af.q = el.value; saveUI(); refreshActions(); }
};
const SUB = {
  'quick-add': f => {
    const el = n => f.elements.namedItem(n);
    const title = el('title').value.trim(); if (!title) return;
    const pid = f.dataset.project || (el('projectId') && el('projectId').value);
    if (!pid || !proj(pid)) { toast('Choisis un projet.', 'error'); return; }
    const due = el('due').value || null;
    const a = { id: uid('a'), projectId: pid, title, description: '', status: 'todo', priority: 'normal', start: due ? minD(today(), due) : today(), due: due || addDays(today(), 7), progress: 0, effort: null, owner: 'Moi', milestoneId: null, dependsOn: [], checklist: [], createdAt: new Date().toISOString(), doneAt: null };
    commit(s => s.actions.push(a));
    toast(`Action ajoutée (échéance ${fmtS(a.due)}).`, 'success', { label: 'Détails', fn: () => editAction(a.id) });
    const inp = $('.quickadd input[name=title]'); if (inp) inp.focus();
  },
  'add-note': f => {
    const el = n => f.elements.namedItem(n);
    const text = el('text').value.trim(); if (!text) return;
    const pid = f.dataset.project || (el('projectId') && el('projectId').value) || null;
    commit(s => s.journal.push({ id: uid('j'), type: 'note', date: el('date').value || today(), projectId: pid, text, createdAt: new Date().toISOString() }));
    toast('Note ajoutée au journal.', 'success');
  }
};
function refreshActions() {
  const box = $('#actions-results'); if (!box) { render(); return; }
  box.innerHTML = actionsResults(box.dataset.project || null);
  $$('.toolbar [data-act="af-status"]').forEach(b => b.classList.toggle('on', UI.af.status.includes(b.dataset.v)));
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  const inMenu = e.target.closest('.menu-wrap');
  if (!inMenu) $$('.menu.open').forEach(m => m.classList.remove('open'));
  if (document.body.classList.contains('side-open') && (!e.target.closest('#sidebar, .hamburger') || e.target.closest('#sidebar a'))) document.body.classList.remove('side-open');
  if (!el) return;
  const input = e.target.closest('input, select, textarea, label');
  if (input && !input.matches('[data-act]') && el.contains(input)) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') && el.dataset.act === 'new-project') e.preventDefault();
  if (el.tagName !== 'A' || el.dataset.act !== 'go') e.preventDefault();
  if (el.closest('.menu')) $$('.menu.open').forEach(m => m.classList.remove('open'));
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pcard[data-act], .kcard[data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INP[el.dataset.input]) INP[el.dataset.input](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); if (SUB[f.dataset.submit]) SUB[f.dataset.submit](f, e); });
$('#file-import').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSONFile(f); e.target.value = ''; });
$('#logo-input').addEventListener('change', e => { const f = e.target.files[0], k = e.target.dataset.k; if (f && (k === 'natran' || k === 'istp')) readLogo(f, k); e.target.value = ''; });

/* Glisser-déposer : kanban (statut) et calendrier (date) */
let dnd = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-dnd]'); if (!el) return;
  dnd = el.dataset.dnd; hideTip();
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dnd);
  setTimeout(() => el.classList.add('dragging'), 0);
});
document.addEventListener('dragend', () => { $$('.dragging, .over').forEach(x => x.classList.remove('dragging', 'over')); dnd = null; });
document.addEventListener('dragover', e => {
  if (!dnd) return;
  const z = e.target.closest('[data-drop-status],[data-drop-date]'); if (!z) return;
  if (z.dataset.dropStatus && !dnd.startsWith('a:')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  $$('.over').forEach(x => { if (x !== z) x.classList.remove('over'); }); z.classList.add('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest('[data-drop-status],[data-drop-date]'); if (!z || !dnd) return;
  e.preventDefault();
  const [k, id] = dnd.split(':'); dnd = null;
  if (z.dataset.dropStatus) {
    const a = act(id); if (!a || a.status === z.dataset.dropStatus) return render();
    commit(() => applyStatus(act(id), z.dataset.dropStatus));
    toast(`« ${a.title} » → ${STATUS[z.dataset.dropStatus].label}`, 'success', { label: 'Annuler', fn: undo });
  } else {
    const d = z.dataset.dropDate;
    if (k === 'a') {
      const a = act(id); if (!a || a.due === d) return render();
      commit(() => { const x = act(id); const delta = x.due ? diffDays(x.due, d) : 0; x.due = d; if (x.start) x.start = addDays(x.start, delta); });
      toast(`Échéance déplacée au ${fmtS(d)}.`, 'success', { label: 'Annuler', fn: undo });
    } else {
      const m = mil(id); if (!m || m.date === d) return render();
      commit(() => { mil(id).date = d; });
      toast(`Jalon déplacé au ${fmtS(d)}.`, 'success', { label: 'Annuler', fn: undo });
    }
  }
});

/* Recherche globale */
const si = $('#search-input'), sp = $('#search-pop');
let sres = [], ssel = 0;
function doSearch(q) {
  q = norm(q.trim()); if (!q) return [];
  const out = [];
  S.projects.forEach(p => { if (norm(`${p.name} ${p.code || ''} ${p.description || ''}`).includes(q)) out.push({ k: 'Projet', t: p.name, c: colorOf(p), run: () => go(`#/projet/${p.id}`) }); });
  S.milestones.forEach(m => { if (norm(m.title + ' ' + (m.description || '')).includes(q)) out.push({ k: 'Jalon · ' + fmtS(m.date), t: '◆ ' + m.title, c: colorOf(proj(m.projectId)), run: () => editMilestone(m.id) }); });
  S.actions.forEach(a => { if (norm(`${a.title} ${a.description || ''} ${a.checklist.map(c => c.text).join(' ')}`).includes(q)) out.push({ k: proj(a.projectId)?.name || 'Action', t: a.title, c: colorOf(proj(a.projectId)), run: () => editAction(a.id) }); });
  S.journal.forEach(j => { const txt = j.type === 'review' ? `${j.done || ''} ${j.blockers || ''} ${j.next || ''}` : (j.text || ''); if (norm(txt).includes(q)) out.push({ k: 'Journal · ' + fmtS(j.date), t: (txt || '').replace(/\s+/g, ' ').slice(0, 80), c: 'var(--muted)', run: () => go('#/journal') }); });
  return out.slice(0, 12);
}
function paintSearch() {
  if (!si.value.trim()) { sp.classList.remove('open'); return; }
  sp.innerHTML = sres.length ? sres.map((r, i) => `<div class="res ${i === ssel ? 'sel' : ''}" data-i="${i}" role="option"><span class="dot" style="--c:${r.c}"></span><span class="t">${esc(r.t)}</span><span class="k">${esc(r.k)}</span></div>`).join('') : '<div class="res muted">Aucun résultat</div>';
  sp.classList.add('open');
}
si.addEventListener('input', () => { sres = doSearch(si.value); ssel = 0; paintSearch(); });
si.addEventListener('focus', () => { if (si.value.trim()) { sres = doSearch(si.value); paintSearch(); } });
si.addEventListener('blur', () => setTimeout(() => sp.classList.remove('open'), 150));
si.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); ssel = Math.min(sres.length - 1, ssel + 1); paintSearch(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); ssel = Math.max(0, ssel - 1); paintSearch(); }
  else if (e.key === 'Enter') { e.preventDefault(); const r = sres[ssel]; if (r) { si.value = ''; sp.classList.remove('open'); si.blur(); r.run(); } }
  else if (e.key === 'Escape') { si.value = ''; sp.classList.remove('open'); si.blur(); }
});
sp.addEventListener('mousedown', e => { const el = e.target.closest('.res[data-i]'); if (!el) return; e.preventDefault(); const r = sres[+el.dataset.i]; si.value = ''; sp.classList.remove('open'); si.blur(); r && r.run(); });

/* Raccourcis clavier */
document.addEventListener('keydown', e => {
  const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
  if (e.key === 'Escape') {
    if (modalOpen()) { closeModal(); return; }
    $$('.menu.open').forEach(m => m.classList.remove('open'));
    document.body.classList.remove('side-open');
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); toast('Sauvegardé ✓', 'success'); return; }
  if (typing || modalOpen()) return;
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); si.focus(); }
  else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); editAction(null); }
});

/* =====================================================================
   10. Démarrage
   ===================================================================== */
function init() {
  loadState();
  applyTheme();
  $('.hamburger').innerHTML = ic('menu');
  $('.search .sico').outerHTML = ic('search', 16);
  $('.plus-ic').outerHTML = ic('plus', 17, 2.2);
  $('#new-menu').innerHTML = [
    ['new-project', 'folder', 'Projet'], ['new-action', 'list', 'Action', 'N'], ['new-milestone', 'flag', 'Jalon'], ['new-note', 'book', 'Note de journal'], ['weekly-review', 'sparkle', 'Revue hebdomadaire']
  ].map(([a, i, l, k]) => `<button type="button" data-act="${a}">${ic(i, 17)} ${l}${k ? `<span class="hint">${k}</span>` : ''}</button>`).join('');
  parseRoute();
  logProgress();
  render();
  resolveLogos();
  saveNow();
  snapshotDaily();
  FileSync.init();
  let day = today();
  setInterval(() => { if (today() !== day) { day = today(); logProgress(); snapshotDaily(); scheduleSave(); render(); } }, 60000);
}
init();
})();
</script>
</body>
